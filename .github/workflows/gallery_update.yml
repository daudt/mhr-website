name: Update Gallery

on:
  push:
    paths:
      - 'images/gallery/**'
  workflow_dispatch:

jobs:
  update-gallery:
    runs-on: arc-runner-set
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run update script
      run: node scripts/update_gallery.js

    - name: Commit and push changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-update gallery.json [skip ci]"
        file_pattern: "data/gallery.json"
