name: Update Gallery

on:
  push:
    paths:
      - 'images/gallery/**'
  workflow_dispatch:

jobs:
  update-gallery:
    runs-on: mhr-website-runner
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Pull latest changes
      run: git pull origin main

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'

    - name: Run update script
      run: node scripts/update_gallery.js

    - name: Commit and push changes
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: "Auto-update gallery.json [skip ci]"
        file_pattern: "data/gallery.json"
